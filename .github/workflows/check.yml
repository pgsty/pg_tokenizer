name: Check

# Temporarily keep CI manual while the local package builds are validated.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: "-Dwarnings -Clink-arg=-Wl,--no-gc-sections"

jobs:
  style:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: License Header
        run: |
          RS_FILES=$(git ls-files 'src/*.rs' 'src/**/*.rs')
          for p in $RS_FILES; do
            diff -u <(head -n 7 "$p") - << 'EOF'
          // Licensed under the Apache License, Version 2.0 (the "License");
          // you may not use this file except in compliance with the License.
          // You may obtain a copy of the License at <http://www.apache.org/licenses/LICENSE-2.0>
          //
          // Copyright (c) 2025-2026 TensorChord Inc.
          // Copyright (c) 2026 PGSTY PTE. LTD.
          // Maintained by Ruohang Feng @ PGSTY (rh@vonng.com)
          EOF
          done
      - name: Typos
        uses: crate-ci/typos@master
      - name: Taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-full-linux-$(uname -m).gz | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          taplo fmt --check
      - name: Rustfmt
        run: cargo fmt --check

  lint:
    strategy:
      matrix:
        version: ["14", "15", "16", "17", "18"]
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set up Environment
        run: ./tools/setup.sh ${{ matrix.version }}
      - name: Clippy
        run: cargo clippy --locked --features pg${{ matrix.version }}
      - name: Unit Test
        run: cargo test --locked --no-fail-fast --features pg${{ matrix.version }}
      - name: Install
        run: cargo pgrx install --features "pg${{ matrix.version }} lindera-ipadic" --release --sudo
      - name: Integration Test
        run: |
          sudo systemctl start postgresql
          psql -c 'CREATE EXTENSION IF NOT EXISTS pg_tokenizer CASCADE;'
          sqllogictest --db $USER --user $USER './tests/**/*.slt'
