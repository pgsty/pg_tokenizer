name: Release

# Build all packages before uploading them to a draft release for review.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag (v1.1.0 or 1.1.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: "ubuntu-latest"

    steps:
      - name: Resolve release tag
        id: release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const version = process.env.INPUT_TAG.trim().replace(/^v/, '');
            const r = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;
            if (!r.test(version)) {
              core.setFailed('Invalid release version. Expected v1.1.0 or 1.1.0.');
              return;
            }
            const tag = `v${version}`;
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: `refs/tags/${tag}`,
            });
            const { data: checks } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'check.yml', head_sha: commit.sha,
              status: 'success', per_page: 1,
            });
            if (checks.workflow_runs.length === 0) {
              core.setFailed('The release commit must pass the Check workflow before packaging.');
              return;
            }
            core.setOutput('semver', version);
            core.setOutput('tag', tag);
            core.setOutput('sha', commit.sha);

    outputs:
      semver: ${{ steps.release.outputs.semver }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

  build:
    needs: ["prepare"]
    strategy:
      fail-fast: false
      matrix:
        version: ["14", "15", "16", "17", "18"]
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-Dwarnings"
      SEMVER: ${{ needs.prepare.outputs.semver }}
      VERSION: ${{ matrix.version }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check package version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          actual = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          expected = os.environ["SEMVER"]
          if actual != expected:
              raise SystemExit(f"Cargo version {actual} does not match release version {expected}")
          if not Path(f"sql/install/pg_tokenizer--{expected}.sql").is_file():
              raise SystemExit(f"Missing install SQL for {expected}")
          PY
      - name: Set up Sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Fall back to uncached compilation
        if: steps.sccache.outcome == 'failure'
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      - name: Set up Environment
        run: ./tools/setup.sh ${{ matrix.version }}
      - name: Build
        run: ./tools/package.sh
      - name: Install and verify release packages
        run: |
          sudo apt-get install -y "./build/postgresql-${VERSION}-pg-tokenizer_${SEMVER}-1_${PLATFORM}.deb"
          unzip -q "./build/postgresql-${VERSION}-pg-tokenizer_${SEMVER}_${ARCH}-linux-gnu.zip" -d /tmp/tokenizer-zip
          diff -r build/zip /tmp/tokenizer-zip
          for file in build/zip/*; do
            if [[ "$file" == *.so ]]; then
              cmp "$file" "$(pg_config --pkglibdir)/$(basename "$file")"
            else
              cmp "$file" "$(pg_config --sharedir)/extension/$(basename "$file")"
            fi
          done
          sudo install -m 644 sql/install/pg_tokenizer--0.1.0.sql sql/install/pg_tokenizer--0.1.1.sql sql/install/pg_tokenizer--1.0.0.sql "$(pg_config --sharedir)/extension/"
          sudo systemctl start postgresql
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_tokenizer;'
          sqllogictest --db "$USER" --user "$USER" './tests/**/*.slt'
          python3 -m venv /tmp/tokenizer-tests
          /tmp/tokenizer-tests/bin/pip install 'psycopg[binary]'
          PG_TOKENIZER_TEST_DSN="host=localhost user=$USER dbname=$USER" timeout 180 /tmp/tokenizer-tests/bin/python tests/test_integration.py
          timeout 120 /tmp/tokenizer-tests/bin/python tests/test_preload.py
          timeout 120 /tmp/tokenizer-tests/bin/python tests/test_standby.py
      - name: Save packages
        uses: actions/upload-artifact@v4
        with:
          name: pg-tokenizer-pg${{ matrix.version }}-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.zip
          if-no-files-found: error

  upload:
    needs: ["prepare", "build", "source"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: pg-tokenizer-*
          merge-multiple: true
          path: artifacts
      - name: Verify and checksum release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        run: |
          cd artifacts
          sha256sum --check "pg_tokenizer-${RELEASE_VERSION}.zip.sha256"
          sha256sum -- *.deb *.zip > SHA256SUMS
      - name: Prepare draft release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`docs/release-notes/${process.env.RELEASE_VERSION}.md`, 'utf8');
            const tag = process.env.RELEASE_TAG;
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: `refs/tags/${tag}`,
            });
            if (commit.sha !== process.env.RELEASE_SHA) {
              core.setFailed('Release tag moved during the build. Refusing to upload.');
              return;
            }
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              if (!release.draft) {
                core.setFailed('Release is already published. Refusing to replace published assets.');
              }
              return;
            }
            await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `pg_tokenizer ${process.env.RELEASE_VERSION}`, draft: true,
              prerelease: tag.includes('-'),
              body,
            });
      - name: Upload packages to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.deb artifacts/*.zip artifacts/*.sha256 artifacts/SHA256SUMS --clobber

  source:
    needs: ["prepare"]
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PGXN source archive
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        run: |
          make dist REF="$RELEASE_SHA"
          test -f "build/dist/pg_tokenizer-$RELEASE_VERSION.zip"
          cd build/dist
          sha256sum --check -- *.sha256
          unzip -t "pg_tokenizer-$RELEASE_VERSION.zip"
      - name: Save source archive
        uses: actions/upload-artifact@v4
        with:
          name: pg-tokenizer-source
          path: |
            build/dist/*.zip
            build/dist/*.sha256
          if-no-files-found: error
