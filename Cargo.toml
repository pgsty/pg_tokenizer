[package]
name = "pg_tokenizer"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []
lindera-ipadic = ["lindera-analysis/embed-ipadic"]
lindera-ipadic-neologd = ["lindera-analysis/embed-ipadic-neologd"]
lindera-unidic = ["lindera-analysis/embed-unidic"]
lindera-ko-dic = ["lindera-analysis/embed-ko-dic"]
lindera-cc-cedict = ["lindera-analysis/embed-cc-cedict"]

[dependencies]
anyhow = "1.0.104"
dashmap = "6.2.1"
jieba-rs = "0.11.0"
lindera = "6.2.0"
lindera-analysis = "6.2.0"
pgrx = "=0.19.3"
regex = "1.13.1"
rust-stemmers = { git = "https://github.com/pgsty/rust-stemmers.git", tag = "v1.2.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tocken = "0.1.0"
tokenizers = "0.23.2"
toml = "1.1.8"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
pgrx-tests = "=0.19.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev-opt]
inherits = "dev"
opt-level = 3
lto = "thin"
codegen-units = 8
